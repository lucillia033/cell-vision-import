
name: Cell Vision Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pytest 설치
        run: pip install pytest

      - name: 파이썬 문법 검사
        run: python -m compileall -q app.py pages

      - name: 자동 테스트 실행
        run: python -m pytest -v

      - name: 자동 테스트 실행
        run: python -m pytest -v
